[project]
name = "dema-strat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arch>=8.0.0",
    "matplotlib>=3.11.1",
    "nbformat>=5.10.4",
    "nbstripout>=0.9.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=18.0.0",
    "quantstats>=0.0.81",
    "scikit-learn>=1.9.0",
    "tabulate>=0.10.0",
    "tqdm>=4.70.0",
    "vectorbt>=0.5.0",
]

[project.scripts]
dema-strat = "dema_strat:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
